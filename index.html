/* Layout: the map fills the screen; the interface floats over it in dark, warm, translucent panels (player card top-left, minimap and quest top-right, log bottom-left, hotbar bottom-center, action dock bottom-right). Deliberately one dark theme. */
:root {
  color-scheme: dark;
  --night: #08060f;
  --panel: rgba(20, 16, 28, 0.84);
  --panel-solid: #16121e;
  --line: rgba(255, 236, 200, 0.13);
  --line-strong: rgba(255, 236, 200, 0.24);
  --ink: #f4ecdf;
  --dim: #c9bca6;
  --faint: #8f8574;
  --gold: #f2b84b;
  --gold-hi: #ffd27a;
  --good: #8fd16a;
  --bad: #ff7b7f;
  --level: #ffd27a;
  --news: #c9a7ff;
  --hp: #d8343c; --hp-hi: #ff6b6f;
  --mp: #3462d6; --mp-hi: #6ea6ff;
  --xp: #6fbf4f; --xp-hi: #b6ec7a;
  --display: "Cinzel", "Figtree", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Figtree", ui-monospace, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--night); color: var(--ink); font: 14px/1.45 var(--body); overflow: hidden; }
img.spr { image-rendering: pixelated; image-rendering: crisp-edges; display: inline-block; vertical-align: middle; }
button { font: inherit; color: inherit; }

/* ---- the stage ---- */
.game { position: relative; height: 100%; overflow: hidden; }
#mapwrap { position: absolute; inset: 0; background: var(--night); }
#map { display: block; cursor: pointer; image-rendering: pixelated; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* player card */
.hud-player { position: absolute; left: 20px; top: 20px; width: 330px; display: flex; flex-direction: column; gap: 8px; }
.pcard { display: flex; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
.portrait { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 2px solid var(--gold); background: radial-gradient(circle at 50% 35%, #3a2f22, #15111c 70%); display: flex; align-items: flex-start; justify-content: center; overflow: hidden; }
.portrait img { width: 80px !important; height: 80px !important; margin-top: 8px; }
.pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.pname { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pname b { font: 700 20px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pname span { font-size: 12px; color: var(--dim); white-space: nowrap; }
.bar { position: relative; height: 14px; border-radius: 7px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.07); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: 7px; background: linear-gradient(var(--xp-hi), var(--xp)); }
.bar span { position: relative; display: block; text-align: center; font: 500 11px/12px var(--display); text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.bar.hp i { background: linear-gradient(var(--hp-hi), var(--hp)); }
.bar.mp i { background: linear-gradient(var(--mp-hi), var(--mp)); }
.bar.mp { height: 11px; } .bar.mp span { font-size: 10px; line-height: 9px; }
.bar.load i { background: linear-gradient(#b6d68a, #7a9b5a); }
.effects { display: flex; flex-wrap: wrap; gap: 6px; }
.fx { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; }
.fx b { font: 500 12px var(--display); }
.fx.good { border-color: rgba(143, 209, 106, 0.5); } .fx.good b { color: var(--good); }
.fx.bad { border-color: rgba(255, 123, 127, 0.5); color: #ffd0d0; } .fx.bad b { color: var(--bad); }
.fx.light { border-color: rgba(242, 184, 75, 0.45); } .fx.light b { color: var(--gold); }
.fx.level { border-color: var(--gold); color: var(--gold-hi); cursor: pointer; }
.fx.sneak { border-color: #b48ee0; color: #d6c2f5; }

/* minimap and quest */
.hud-right { position: absolute; right: 20px; top: 20px; width: 250px; display: flex; flex-direction: column; gap: 10px; }
.mapcard { padding: 10px; }
#minimap { display: block; width: 100%; height: 132px; border-radius: 9px; background: #120f19; image-rendering: pixelated; }
.loc { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; }
.loc b { font: 700 15px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.loc span { font-size: 12px; color: var(--dim); white-space: nowrap; }
.quest { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: rgba(20, 16, 28, 0.66); }
.q-kicker { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.q-title { font: 700 16px var(--display); }
.q-step { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.q-step i { width: 13px; height: 13px; flex: none; margin-top: 3px; border: 1.5px solid var(--dim); border-radius: 3px; }
.q-step em { margin-left: auto; font: 500 12px var(--display); color: var(--dim); font-style: normal; }
.q-step.done { color: var(--faint); text-decoration: line-through; }
.q-step.done i { border-color: var(--good); background: linear-gradient(135deg, transparent 45%, var(--good) 45% 60%, transparent 60%); }
.q-meta { font-size: 12px; color: var(--dim); padding-top: 4px; border-top: 1px solid var(--line); }
.q-news { font-size: 12px; color: var(--news); }

/* message log */
#log { position: absolute; left: 20px; bottom: 120px; width: min(460px, 42vw); max-height: 140px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; font-size: 13px; text-shadow: 0 1px 3px #000, 0 0 2px #000; cursor: pointer; }
#log.open { max-height: 50vh; overflow-y: auto; justify-content: flex-start; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-shadow: none; }
.ln.bad { color: #ffb3b3; } .ln.good { color: #c7f0a8; } .ln.gold { color: var(--gold-hi); display: block; height: auto; padding: 0; font: inherit; }
.ln.gold::before { content: none; }
.ln.level { color: var(--gold-hi); font-weight: 700; } .ln.news { color: var(--news); font-style: italic; }
.ln.warn { color: #ffc98a; } .ln.talk { color: #bcd0ff; } .ln.kill { font-weight: 700; }

/* hotbar */
.hotbar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 7px; }
.xpline { width: 100%; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.06); overflow: hidden; }
.xpline i { display: block; height: 100%; background: linear-gradient(90deg, var(--xp), var(--xp-hi)); }
.slots-row { display: flex; gap: 7px; padding: 9px; border-radius: 16px; }
.hslot { position: relative; width: 54px; height: 54px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.hslot:hover { border-color: var(--line-strong); background: rgba(255, 255, 255, 0.08); }
.hslot img { width: 38px !important; height: 38px !important; }
.hslot.equipped { border: 2px solid var(--gold); background: rgba(242, 184, 75, 0.14); }
.hslot.empty { border-style: dashed; background: rgba(255, 255, 255, 0.02); cursor: default; }
.hslot.dim img { opacity: 0.4; }
.hk { position: absolute; left: 5px; top: 1px; font: 500 11px var(--display); color: var(--dim); }
.hc { position: absolute; right: 5px; bottom: 1px; font: 700 13px var(--display); text-shadow: 0 1px 2px #000; }
.cool { position: absolute; inset: 0; border-radius: 10px; background: rgba(8, 6, 15, 0.6); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }

/* action dock */
.dock { position: absolute; right: 20px; bottom: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 460px; }
.gold { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; font: 700 17px var(--display); color: var(--gold); }
.gold::before { content: ''; width: 20px; height: 20px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' shape-rendering='crispEdges'><circle cx='10' cy='10' r='9' fill='%232a1e10'/><circle cx='10' cy='10' r='8' fill='%23b8862a'/><circle cx='9.4' cy='9.4' r='7' fill='%23e3b93c'/><circle cx='10' cy='10' r='5.4' fill='none' stroke='%23b8862a' stroke-width='1'/><circle cx='10' cy='10' r='2.2' fill='%23b8862a'/><g stroke='%23b8862a' stroke-width='1'><path d='M10 4.6v1.6M10 13.8v1.6M4.6 10h1.6M13.8 10h1.6M6.2 6.2l1.1 1.1M12.7 12.7l1.1 1.1M13.8 6.2l-1.1 1.1M7.3 12.7l-1.1 1.1'/></g><path d='M5 7a6 6 0 0 1 4-3.4' stroke='%23fff3c4' stroke-width='1.2' fill='none'/></svg>") center / contain no-repeat; }
.dbtn { height: 46px; min-width: 46px; padding: 0 10px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 13px; }
.dbtn:hover { border-color: var(--line-strong); background: rgba(40, 32, 52, 0.9); }
.dbtn [data-icon] { width: 26px; height: 26px; display: inline-flex; }
.dbtn [data-icon] img { width: 26px !important; height: 26px !important; }
.dbtn kbd { font: 500 11px var(--display); color: var(--faint); }

/* title screen */
#title { position: absolute; inset: 0; z-index: 9; background: #120c22; overflow: hidden; }
#title-cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.title-ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 48px 6vw; gap: 26px; max-width: 560px; overflow-y: auto; }
.title-kicker { font: 600 13px var(--body); letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold-hi); opacity: 0.85; }
.title-logo h1 { margin: 6px 0 0; font: 700 clamp(40px, 6vw, 72px)/0.95 var(--display); letter-spacing: 0.01em;
  background: linear-gradient(100deg, #fff3d6 0%, #ffd98a 30%, #fffaf0 45%, #ffd98a 55%, #f2c06a 75%, #fff3d6 100%); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #6a2e14) drop-shadow(0 10px 26px rgba(255, 150, 60, 0.4)); animation: title-shimmer 7s ease-in-out infinite; }

.tbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255, 236, 200, 0.18); background: rgba(22, 16, 30, 0.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: var(--ink); font: 700 18px var(--display); cursor: pointer; text-align: left; transition: transform .12s, background .12s, border-color .12s; }

.tbtn.small { padding: 8px 14px; font-size: 14px; border-radius: 10px; }
.tbtn.back { margin-top: 6px; align-self: flex-start; }
.title-panel h2 { margin: 0 0 12px; font: 700 22px var(--display); color: #fff3d6; }
.slots { display: flex; flex-direction: column; gap: 10px; }
.slot { border-radius: 14px; border: 1px solid rgba(255, 236, 200, 0.18); background: rgba(22, 16, 30, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }

@media (max-width: 760px) { .title-ui { justify-content: flex-end; padding: 24px 16px 28px; max-width: none; gap: 16px; } .title-menu { max-width: none; } }

.need { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: rgba(255,255,255,0.03); }
.need.new { border-color: var(--gold); background: rgba(255, 205, 107, 0.06); }
.need b { font: 700 14px var(--display); } .need p { margin: 6px 0; }
.counsel p { margin: 10px 0 12px; }
.btn.choice { display: block; width: 100%; text-align: left; white-space: normal; height: auto; padding: 10px 12px; margin: 6px 0; line-height: 1.35; }
.topics { margin-top: 12px; flex-wrap: wrap; }

.dlg-topics .btn.has-new::after, .dlg-people .btn.has-new::after { content: ''; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

.tone { display: inline-block; min-width: 56px; margin-right: 6px; padding: 1px 6px; border-radius: 6px; font: 600 10px var(--display); letter-spacing: 0.04em; text-transform: uppercase; text-align: center; background: rgba(255,255,255,0.08); color: var(--dim); }
.tone-kind { color: #ffb3c1; } .tone-blunt { color: #ffcf8a; } .tone-pious { color: #ffe79a; } .tone-joke { color: #a8e6a1; } .tone-curious { color: #9fd0ff; }
.parish-head { display: flex; gap: 16px; align-items: flex-start; } .parish-head > div { min-width: 180px; display: flex; flex-direction: column; } .parish-head p { margin: 0; }
.ledger { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 12px; }
.ledger-list { display: flex; flex-direction: column; gap: 4px; max-height: 420px; overflow: auto; }
.lp { display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px 8px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--ink); cursor: pointer; position: relative; font: inherit; }
.lp:hover { background: rgba(255,255,255,0.05); } .lp.on { border-color: var(--line-strong); background: rgba(255,255,255,0.07); }
.lp span { display: flex; flex-direction: column; min-width: 0; } .lp b { font-size: 13px; } .lp small { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp .mk { position: absolute; right: 8px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--gold); }
.ledger-page h4 { margin: 12px 0 4px; font: 700 13px var(--display); color: var(--gold-hi); }
.pfacts { margin: 0; padding-left: 18px; } .pfacts li { margin: 4px 0; font-size: 13px; line-height: 1.45; }
.q-parish { margin-top: 2px; font-size: 12px; color: var(--gold-hi); cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font-family: inherit; }
@media (max-width: 760px) { .ledger { grid-template-columns: 1fr; } .ledger-list { max-height: 180px; } .parish-head { flex-direction: column; gap: 6px; } }

/* target card */
#target { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); width: min(360px, calc(100% - 640px)); min-width: 250px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
#target[hidden] { display: none; }
#target .bar { width: 100%; }
#target .tg-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
#target .tg-name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
#target .tg-name b { min-width: 0; }
#target .tg-name b { font: 700 15px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#target .tg-name span { font-size: 11px; color: var(--dim); white-space: nowrap; }

.tg-btn { height: 34px; min-width: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line-strong); background: rgba(255, 255, 255, 0.05); color: var(--ink); cursor: pointer; font: 600 13px var(--body); }

.tg-btn.fire { background: linear-gradient(#ffcd6b, #e9a332); color: #1a1206; border-color: transparent; font-weight: 700; }

/* pick-up prompt */
#prompt { position: absolute; transform: translateX(-50%); left: 50% !important; top: auto !important; bottom: 92px; z-index: 6; display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(18, 15, 26, 0.88); border: 1px solid var(--line-strong); font-size: 13px; white-space: nowrap; cursor: pointer; pointer-events: auto; }
#prompt kbd { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #18141f; display: inline-flex; align-items: center; justify-content: center; font: 700 13px var(--display); }

/* touch pad */
.pad { display: none; position: absolute; left: 16px; bottom: 16px; grid-template-columns: repeat(3, 50px); gap: 6px; }
.pad button { height: 50px; border-radius: 12px; font-size: 18px; background: rgba(20, 16, 28, 0.6); border: 1px solid var(--line); color: var(--ink); }

/* ---- buttons, fields ---- */
.btn { font: 600 13px var(--body); color: var(--ink); background: rgba(255, 255, 255, 0.06); padding: 8px 16px; cursor: pointer; border: 1px solid var(--line-strong); border-radius: 10px; }
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: default; }
.btn.tiny { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
.btn.ghost:hover:not(:disabled) { border-color: var(--line); }
.btn.default { background: linear-gradient(#ffcd6b, #e9a332); color: #1a1206; border-color: transparent; font-weight: 700; box-shadow: 0 6px 16px rgba(242, 160, 59, 0.3); }
.btn.default:hover:not(:disabled) { background: linear-gradient(#ffd884, #f0ad3c); }
.btn.glow { color: var(--gold-hi); border-color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input[type=checkbox], input[type=radio] { accent-color: var(--gold); }
input[type=text], input:not([type]) { font: 600 16px var(--body); color: var(--ink); caret-color: var(--gold); background: rgba(0, 0, 0, 0.35); padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 10px; }

/* ---- windows ---- */
#modal { position: fixed; inset: 0; background: rgba(6, 4, 12, 0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#modal .win { width: min(600px, 100%); max-height: 90vh; max-height: 90dvh; display: flex; flex-direction: column; background: rgba(22, 18, 30, 0.96); border: 1px solid var(--line-strong); border-radius: 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); overflow: hidden; }
#modal .win.wide { width: min(1160px, 100%); }
.titlebar { display: flex; align-items: center; gap: 12px; padding: 14px 18px 12px 22px; border-bottom: 1px solid var(--line); }
.titlebar .grow { order: 0; flex: 1; font: 700 20px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#modal-x { order: 1; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); }

#modal-x:hover { background: rgba(255, 255, 255, 0.08); }
#modal-body { padding: 18px 22px 20px; overflow-y: auto; }

#modal-body p { margin: 0 0 10px; max-width: 68ch; color: var(--ink); }
.lead { font-size: 15px; }
.hint { font-size: 12px; color: var(--dim); margin-top: 12px !important; }
.dim { color: var(--dim); font-weight: 400; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; }
.namerow { display: flex; gap: 8px; align-items: center; margin: 12px 0 4px; flex-wrap: wrap; }

/* lists and rows */
.list { border: 1px solid var(--line); border-radius: 12px; max-height: 54vh; overflow-y: auto; background: rgba(0, 0, 0, 0.22); }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid rgba(255, 236, 200, 0.06); flex-wrap: wrap; }

.row:hover { background: rgba(255, 255, 255, 0.04); }
.row.empty { opacity: 0.5; }
.row .gl { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex: none; border-radius: 9px; background: rgba(255, 255, 255, 0.04); }
.row .nm { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; }

.row .acts { display: flex; gap: 6px; flex: none; }
.row .slot { font-size: 12px; color: var(--dim); max-width: 180px; }
.price { font: 500 13px var(--display); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; color: var(--gold); }
.price.up { color: var(--bad); } .price.down { color: var(--good); }
.qty { font-size: 12px; color: var(--dim); min-width: 72px; text-align: right; }
.mats { display: flex; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.mats span { display: inline-flex; align-items: center; gap: 2px; }
.mats small { color: var(--dim); font-size: 11px; }
.ok { color: var(--good); } .no { color: var(--bad); }
.lock { font-size: 12px; color: var(--dim); }
.keeper { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.keeper .gl.big { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #3a2f22, #15111c 70%); border: 1px solid var(--line-strong); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
.keeper p { flex: 1 1 260px; margin: 0 !important; color: var(--ink); }
.purse { font: 700 17px var(--display); color: var(--gold); display: flex; gap: 6px; align-items: center; }
.paperdoll { display: flex; justify-content: center; }
.title-art { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 12px; flex-wrap: wrap; }
.title-art .vs { display: flex; gap: 4px; }

/* pill tabs */
.tabs, .sheet-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab, .stab { font: 600 13px var(--body); color: var(--dim); background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 7px 15px; cursor: pointer; }
.tab:hover, .stab:hover { color: var(--ink); border-color: var(--line); }
.tab.on, .stab.on { background: var(--ink); color: #18141f; }
.sheet { min-height: 380px; }
.sheet h3:first-child { margin-top: 0; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols section { min-width: 0; }
.matgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.matgrid div { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; display: flex; gap: 6px; align-items: center; font-size: 12px; }

.matgrid span small { color: var(--dim); font-size: 11px; }
.matgrid b { margin-left: auto; font-variant-numeric: tabular-nums; }

/* inventory: equipment, grid, detail card */
.inv2 { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 20px; }
.equip { display: flex; flex-direction: column; gap: 14px; }
.equip-row { display: grid; grid-template-columns: 62px 1fr 62px; gap: 8px; align-items: center; }
.eqcol { display: flex; flex-direction: column; gap: 8px; }
.stage { height: 270px; border-radius: 16px; background: radial-gradient(ellipse at 50% 88%, rgba(242, 184, 75, 0.28), rgba(0, 0, 0, 0) 60%), linear-gradient(#211a2c, #15111c); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.stage img { width: auto !important; height: 228px !important; margin-bottom: 16px; image-rendering: pixelated; }
.cell { position: relative; aspect-ratio: 1; border-radius: 10px; background: color-mix(in srgb, var(--c, #9a9a9a) 12%, transparent); border: 1px solid color-mix(in srgb, var(--c, #9a9a9a) 70%, transparent); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.cell img { width: 70% !important; height: 70% !important; }
.cell.empty { --c: #6b6575; border-style: dashed; cursor: default; opacity: 0.6; }
.cell.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell .cnt { position: absolute; right: 5px; bottom: 1px; font: 700 13px var(--display); text-shadow: 0 1px 2px #000; }
.cell .ph { font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); text-align: center; line-height: 1.1; }
.eqcol .cell { width: 62px; }
.grid8 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 7px; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.filters button { font: 600 12px var(--body); padding: 5px 11px; border-radius: 8px; border: 0; background: transparent; color: var(--dim); cursor: pointer; }
.filters button.on { background: rgba(242, 184, 75, 0.16); color: var(--gold); }
.carry { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; font-size: 13px; }
.carry div:first-child { display: flex; justify-content: space-between; color: var(--dim); }
.card { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--c, #9a9a9a) 55%, transparent); background: linear-gradient(color-mix(in srgb, var(--c, #9a9a9a) 16%, transparent), transparent 45%), rgba(255, 255, 255, 0.03); }
.card-head { display: flex; gap: 12px; align-items: center; }
.card-icon { width: 64px; height: 64px; flex: none; border-radius: 14px; border: 2px solid var(--c, #9a9a9a); background: color-mix(in srgb, var(--c, #9a9a9a) 16%, transparent); display: flex; align-items: center; justify-content: center; }
.card-icon img { width: 46px !important; height: 46px !important; }
.card-name { font: 700 19px var(--display); line-height: 1.15; }
.card-kind { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c, var(--dim)); }
.card-stats { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.card-stats div { display: flex; justify-content: space-between; gap: 10px; }
.card-stats span:first-child { color: var(--dim); }
.up { color: var(--good); } .down { color: var(--bad); }
.card-note { font-size: 13px; color: var(--dim); font-style: italic; margin: 0; }
.card-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); padding-top: 8px; border-top: 1px solid var(--line); }
.card-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.card-btns .btn { flex: 1; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 11px; color: var(--dim); }
.legend span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }

/* character, skills, gods */
.char-head { display: flex; gap: 16px; align-items: center; margin-bottom: 10px; }
.char-head > div { flex: 1; min-width: 0; }
.char-head h3 { margin: 0 !important; font-size: 22px !important; }
.char-head label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.facts div { display: flex; justify-content: space-between; background: rgba(255, 255, 255, 0.04); border-radius: 10px; padding: 7px 12px; }
.facts span { color: var(--dim); } .facts b { font: 500 14px var(--display); }
.attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.attr { background: rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 8px 12px; display: grid; grid-template-columns: 1fr auto auto; gap: 0 10px; align-items: center; }
.attr b { font: 700 22px var(--display); } .attr small { grid-column: 1; color: var(--dim); font-size: 12px; }
.attr .btn { grid-row: 1 / span 2; grid-column: 3; }
.trees { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tree { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.tree h3 { margin: 0 0 2px !important; }
.tree p { font-size: 12px; color: var(--dim) !important; }
.node { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 7px 10px; margin-top: 6px; background: rgba(0, 0, 0, 0.25); border-radius: 10px; border-left: 3px solid #4a4356; }
.node div { display: flex; flex-direction: column; min-width: 0; }
.node small { font-size: 12px; color: var(--dim); }
.node.owned { border-left-color: var(--good); }
.node.open { border-left-color: var(--gold); }
.node.locked { opacity: 0.5; }
.tick { color: var(--good); font-weight: 700; }
.pill { font: 700 12px var(--body); background: var(--gold); color: #1a1206; padding: 2px 10px; border-radius: 999px; }

/* a solid strip along the very top edge: Safari tints its own bars from what touches the top of the page, and the
   map there (grey cobbles) made a grey bar; in the home-screen app it also sits behind the clock and battery */

body.phone #topband { display: block; position: fixed; top: 0; left: 0; right: 0; height: max(env(safe-area-inset-top), 3px); background: #08060f; z-index: 8; pointer-events: none; }
/* ---- character creation in three steps ---- */

.cr2-steps { display: flex; gap: 6px; }

.cr2-top { display: flex; gap: 14px; align-items: center; }
.cr2-stage { width: 132px; height: 150px; flex: none; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; border-radius: 14px; background: radial-gradient(ellipse at 50% 88%, rgba(242,184,75,0.3), rgba(20,16,28,0) 70%); }

body.phone .cr2-grid { grid-template-columns: 1fr; }
body.phone .cr2-row { min-height: 31px; padding: 1px 0; grid-template-columns: 58px minmax(0, 1fr); }

body.phone #modal-body:has(.creator2) { padding-top: 8px; }
/* ---- the title screen on a phone: everything on one screen, no scrolling ---- */
body.phone .title-ui { justify-content: flex-end; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px); gap: 12px; max-width: none; }
body.phone .title-kicker { font-size: 10.5px; letter-spacing: 0.22em; gap: 8px; }
body.phone .title-kicker::before, body.phone .title-kicker::after { width: 18px; }
body.phone .title-logo h1 { font-size: clamp(30px, 10.5vw, 44px); }
body.phone .title-logo::after { display: none; }
body.phone .title-foot { display: none; }
body.phone nav.title-menu { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: none; }
body.phone nav.title-menu .tbtn { grid-column: span 3; padding: 11px 16px; border-radius: 12px; }
body.phone nav.title-menu .tbtn:hover:not([disabled]) { transform: none; }
/* the three smaller choices share one row */
body.phone nav.title-menu .tbtn:nth-last-child(-n+3) { grid-column: span 1; padding: 10px 4px; align-items: center; justify-content: center; text-align: center; font-size: 13px; line-height: 1.15; }
body.phone nav.title-menu .tbtn.ghost { background: rgba(22, 16, 30, 0.5); border-color: rgba(255, 236, 200, 0.14); }
body.phone .title-panel h2 { font-size: 18px; margin-bottom: 8px; }
body.phone .slots { gap: 8px; }
body.phone .slot { padding: 8px 12px; gap: 6px; border-radius: 12px; }
body.phone .slot-body img { width: 44px !important; height: 44px !important; }
body.phone .slot-body b { font-size: 15px; }
@media (max-height: 620px) {
  body.phone .title-ui { gap: 8px; padding-bottom: calc(env(safe-area-inset-bottom) + 10px); }
  body.phone .title-logo h1 { font-size: clamp(26px, 8.5vw, 36px); }
  body.phone nav.title-menu .tbtn { padding: 9px 14px; }
}
.epi { text-align: center; padding: 18px 8px 6px; }
.epi-n { font-size: 11px; letter-spacing: .2em; color: var(--faint); }
.epi-t { font: 700 26px var(--display); color: var(--gold-hi); margin: 10px 0 14px; }
.epi-p { font-size: 15px; line-height: 1.6; max-width: 520px; margin: 0 auto; }
</style>
</head>

<div id="topband" aria-hidden="true"></div>
<div class="game" role="application" aria-label="The Temple Warden">
  <div id="mapwrap"><canvas id="map" aria-label="Game map"></canvas><div id="zoombar"><button id="zrun" aria-label="Walk or run" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="14" cy="4" r="2.2"/><path d="M10.5 8.2 14 7.4c.7-.2 1.4.2 1.7.8l1.6 3.3 2.8.9-.6 1.8-3.6-1.1-.9-1.8-1.3 3.4 2.6 2.4V22h-2v-4.2l-2.9-2.6-1.2 3.2L6.4 22l-1.6-1.2 3-3.5 2.2-6.1-1.6.5-1.2 2.7-1.8-.8 1.6-3.6z"/></svg></button><button id="zin" title="Zoom in (+)" aria-label="Zoom in">+</button><button id="zout" title="Zoom out (−)" aria-label="Zoom out">−</button></div></div>

  <div class="hud-player">
    <div class="pcard panel" data-a="hero" data-v="char" title="Character (P)">
      <div class="portrait" id="hud-portrait"></div>
      <div class="pinfo">
        <div class="pname"><b id="hud-name"></b><span id="hud-level"></span></div>
        <div class="bar hp" id="hud-hp"></div>
        <div class="bar mp" id="hud-mp"></div>
      </div>
    </div>
    <div class="effects" id="hud-effects"></div>
    <div id="target" class="panel" hidden aria-live="polite"></div>
  </div>

  <div class="hud-right">
    <div class="mapcard panel"><canvas id="minimap" width="230" height="132" aria-label="Minimap"></canvas><div class="loc" id="hud-loc"></div></div>
    <div class="quest panel" id="hud-quest"></div>
  </div>

  <div id="log" aria-live="polite" title="Click to show the full log"></div>
  <div id="prompt" hidden data-a="get"></div>

  <div class="hotbar">
    <div class="xpline" title="Experience"><i id="hud-xp"></i></div>
    <div class="slots-row panel" id="hotbar-slots" aria-label="Hotbar"></div>
  </div>

  <div class="pad" aria-label="Movement pad">
    <button data-a="dir" data-v="-1,-1" aria-label="Up left">↖</button><button data-a="dir" data-v="0,-1" aria-label="Up">↑</button><button data-a="dir" data-v="1,-1" aria-label="Up right">↗</button>
    <button data-a="dir" data-v="-1,0" aria-label="Left">←</button><button data-a="dir" data-v="0,0" aria-label="Wait">·</button><button data-a="dir" data-v="1,0" aria-label="Right">→</button>
    <button data-a="dir" data-v="-1,1" aria-label="Down left">↙</button><button data-a="dir" data-v="0,1" aria-label="Down">↓</button><button data-a="dir" data-v="1,1" aria-label="Down right">↘</button>
  </div>

  <div class="dock">
    <div class="gold panel" id="hud-gold" title="Gold"></div>
    <button class="dbtn panel" data-a="get" title="Pick up (G)"><span data-icon="get"></span><kbd>G</kbd></button>
    <button class="dbtn panel" data-a="rest" title="Rest until healed (R)"><span data-icon="rest"></span><kbd>R</kbd></button>
    <button class="dbtn panel" data-a="torch" title="Set down a torch (T)"><span data-icon="torch"></span><kbd>T</kbd></button>
    <button class="dbtn panel" data-a="fire" title="Shoot your bow (F)"><span data-icon="bow"></span><kbd>F</kbd></button>
    <button class="dbtn panel" data-a="sneak" title="Sneak (Shift+S or M)"><span data-icon="sneak"></span><kbd>M</kbd></button>
    <button class="dbtn panel" data-a="hero" data-v="inv" title="Inventory (I)"><span data-icon="backpack"></span><span class="tl">Pack</span></button>
    <button class="dbtn panel" data-a="game" data-v="options" title="Menu: options, help and saving (O)" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </div>
</div>

<div id="modal" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="titlebar"><span class="grow" id="modal-title"></span><button id="modal-x" data-a="close" aria-label="Close"></button></div>
    <div id="modal-body"></div>
  </div>
</div>
